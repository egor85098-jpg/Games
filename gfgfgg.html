<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>5 игр</title><style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,sans-serif;background:#0a0e17;color:#e8eefc;padding:14px;min-height:100vh;user-select:none}
#a{max-width:480px;margin:0 auto}
h1{text-align:center;font-size:22px;margin-bottom:14px;color:#7dffc4}
.m{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.c{padding:18px 8px;border:1px solid rgba(255,255,255,.1);border-radius:14px;background:rgba(255,255,255,.05);color:#e8eefc;font-family:inherit;font-size:14px;font-weight:700}
.c:active{background:rgba(255,255,255,.15)}
.g{display:none;flex-direction:column;align-items:center;gap:10px}
.g.on{display:flex}
.b{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px}
.b h2{font-size:16px}.h{font-size:13px;color:#9fb0d4}.h b{color:#7dffc4}
.btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.13);color:#e8eefc;padding:10px 14px;border-radius:10px;font-family:inherit;font-size:13px;min-height:40px}
.btn:active{background:rgba(255,255,255,.2)}
canvas{border-radius:12px;touch-action:none;max-width:100%}
.dp{display:grid;grid-template-columns:repeat(3,60px);gap:6px}
.dp button{width:60px;height:60px;border-radius:12px;font-size:22px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.13);color:#e8eefc}
.dp button:active{background:rgba(255,255,255,.24)}.sp{visibility:hidden}
.b2{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:6px;background:#161f36;border-radius:12px;width:min(340px,90vw);aspect-ratio:1;touch-action:none}
.t{display:flex;align-items:center;justify-content:center;border-radius:7px;font-weight:800;color:#fff;background:rgba(255,255,255,.05);font-size:clamp(14px,5vw,24px)}
.ms{min-height:16px;font-size:12px;color:#ffd479;font-weight:600;text-align:center}
.tt{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:min(280px,86vw);aspect-ratio:1}
.cl{display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:10px;font-size:clamp(30px,11vw,50px);font-weight:800}
.cl:active{background:rgba(255,255,255,.14)}.cl.x{color:#6ea8ff}.cl.o{color:#ff8fa8}
.mm{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:min(340px,90vw)}
.mc{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:clamp(20px,7vw,30px);border-radius:10px;background:linear-gradient(150deg,#2a3a63,#1b2743);border:1px solid rgba(255,255,255,.1);user-select:none}
.mc.fl,.mc.dn{background:linear-gradient(150deg,#3d5a8f,#2b3f66);border-color:#6ea8ff}
.mc.dn{opacity:.5}
</style></head><body><div id="a">
<h1>🎮 5 игр</h1>
<div id="menu" class="m">
<button class="c" onclick="go('snake')">🐍 Змейка</button>
<button class="c" onclick="go('g2048')">🔢 2048</button>
<button class="c" onclick="go('pong')">🏓 Пинг-понг</button>
<button class="c" onclick="go('ttt')">❌ Крестики-нолики</button>
<button class="c" onclick="go('memory')">🧠 Мемори</button>
</div>

<div id="snake" class="g">
<div class="b"><button class="btn" onclick="back()">← Меню</button><h2>🐍</h2><div class="h">Счёт: <b id="ss">0</b></div></div>
<canvas id="sc"></canvas>
<div class="dp"><span class="sp"></span><button onclick="sd(0,-1)">▲</button><span class="sp"></span><button onclick="sd(-1,0)">◀</button><button onclick="sd(0,1)">▼</button><button onclick="sd(1,0)">▶</button></div>
</div>

<div id="g2048" class="g">
<div class="b"><button class="btn" onclick="back()">← Меню</button><h2>🔢 2048</h2><div class="h">Счёт: <b id="s2">0</b></div></div>
<div id="b2" class="b2"></div>
<div id="m2" class="ms"></div>
<button class="btn" onclick="start2048()">Новая игра</button>
</div>

<div id="pong" class="g">
<div class="b"><button class="btn" onclick="back()">← Меню</button><h2>🏓</h2><div class="h">Вы <b id="sp">0:0</b> ИИ</div></div>
<canvas id="pc"></canvas>
</div>

<div id="ttt" class="g">
<div class="b"><button class="btn" onclick="back()">← Меню</button><h2>❌ Нолики</h2><div class="h">Вы X</div></div>
<div id="tb" class="tt"></div>
<div id="tm" class="ms"></div>
<button class="btn" onclick="startTTT()">Заново</button>
</div>

<div id="memory" class="g">
<div class="b"><button class="btn" onclick="back()">← Меню</button><h2>🧠 Мемори</h2><div class="h">Ходы: <b id="sm">0</b></div></div>
<div id="mb" class="mm"></div>
<div id="mm2" class="ms"></div>
<button class="btn" onclick="startMem()">Заново</button>
</div>
</div>

<script>
var cur=null;
function go(id){document.getElementById('menu').style.display='none';
document.getElementById(id).classList.add('on');cur=id;
if(id=='snake')resetSnake();if(id=='g2048')start2048();
if(id=='pong')startPong();if(id=='ttt')startTTT();if(id=='memory')startMem();}
function back(){if(cur=='snake'&&sTimer)clearInterval(sTimer);
if(cur=='pong'&&pRun)pRun=false;
document.getElementById(cur).classList.remove('on');
document.getElementById('menu').style.display='grid';cur=null;}

/* ЗМЕЙКА */
var sc=document.getElementById('sc'),sx2=sc.getContext('2d');
var SN=15,SS=Math.min(window.innerWidth*.88,340),SC=Math.floor(SS/SN);
sc.width=SC*SN;sc.height=SC*SN;
var snk,sdir,sq,sfood,sscore,sTimer,sspeed,sover;
function rndF(){var p;do{p={x:(Math.random()*SN)|0,y:(Math.random()*SN)|0}}
while(snk.some(function(s){return s.x==p.x&&s.y==p.y}));return p}
function resetSnake(){snk=[{x:7,y:7},{x:6,y:7},{x:5,y:7}];sdir={x:1,y:0};sq=[];
sscore=0;sspeed=170;sover=false;sfood=rndF();document.getElementById('ss').textContent=0;
clearInterval(sTimer);sTimer=setInterval(sTick,sspeed);sDraw()}
function sTick(){if(sover)return;if(sq.length){var nd=sq.shift();
if(nd.x!=-sdir.x||nd.y!=-sdir.y)sdir=nd}
var h={x:snk[0].x+sdir.x,y:snk[0].y+sdir.y};
if(h.x<0||h.y<0||h.x>=SN||h.y>=SN||snk.some(function(s){return s.x==h.x&&s.y==h.y}))
{sover=true;clearInterval(sTimer);sDraw();return}
snk.unshift(h);
if(h.x==sfood.x&&h.y==sfood.y){sscore+=10;document.getElementById('ss').textContent=sscore;
sfood=rndF();if(sspeed>80){sspeed-=6;clearInterval(sTimer);sTimer=setInterval(sTick,sspeed)}}
else snk.pop();sDraw()}
function sR(x,y,w,h,r){sx2.beginPath();sx2.moveTo(x+r,y);sx2.arcTo(x+w,y,x+w,y+h,r);
sx2.arcTo(x+w,y+h,x,y+h,r);sx2.arcTo(x,y+h,x,y,r);sx2.arcTo(x,y,x+w,y,r);sx2.closePath()}
function sDraw(){sx2.fillStyle='#0f1729';sx2.fillRect(0,0,sc.width,sc.height);
sx2.fillStyle='#ff5a7a';sR(sfood.x*SC+2,sfood.y*SC+2,SC-4,SC-4,4);sx2.fill();
for(var i=0;i<snk.length;i++){var s=snk[i];
sx2.fillStyle=i==0?'#7dffc4':'hsl(160,60%,'+Math.max(28,52-i*1.5)+'%)';
sR(s.x*SC+1,s.y*SC+1,SC-2,SC-2,i==0?5:3);sx2.fill()}
if(sover){sx2.fillStyle='rgba(0,0,0,.8)';sx2.fillRect(0,0,sc.width,sc.height);
sx2.fillStyle='#fff';sx2.textAlign='center';sx2.font='bold '+(SC*1.1)+'px sans-serif';
sx2.fillText('Конец',sc.width/2,sc.height/2);sx2.font=(SC*.6)+'px sans-serif';
sx2.fillText('Счёт: '+sscore+' • тап',sc.width/2,sc.height/2+SC)}}
function sd(x,y){var l=sq.length?sq[sq.length-1]:sdir;
if(x==-l.x&&y==-l.y)return;if(x==l.x&&y==l.y)return;if(sq.length<2)sq.push({x:x,y:y})}
var stx=0,sty=0;
sc.addEventListener('touchstart',function(e){var t=e.changedTouches[0];
stx=t.clientX;sty=t.clientY;if(sover)resetSnake()},{passive:true});
sc.addEventListener('touchend',function(e){var t=e.changedTouches[0];
var dx=t.clientX-stx,dy=t.clientY-sty;
if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;
if(Math.abs(dx)>Math.abs(dy))sd(dx>0?1:-1,0);else sd(0,dy>0?1:-1)},{passive:true});
var SK={arrowup:[0,-1],arrowdown:[0,1],arrowleft:[-1,0],arrowright:[1,0],
w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]};

/* 2048 */
var b2,sc2,o2,wn2;
var C2={2:'#3b4a6b',4:'#41577f',8:'#e8a33d',16:'#e88b2f',32:'#e56a3c',
64:'#e04b4b',128:'#4fbf7a',256:'#3fae6b',512:'#37a05f',1024:'#3b7ddd',2048:'#7b5cff'};
var L2={l:[],r:[],u:[],d:[]};
for(var r2=0;r2<4;r2++){L2.l.push([0,1,2,3].map(function(c){return r2*4+c}));
L2.r.push([3,2,1,0].map(function(c){return r2*4+c}))}
for(var c2=0;c2<4;c2++){L2.u.push([0,1,2,3].map(function(r){return r*4+c2}));
L2.d.push([3,2,1,0].map(function(r){return r*4+c2}))}
function start2048(){b2=[];for(var i=0;i<16;i++)b2.push(0);
sc2=0;o2=false;wn2=false;document.getElementById('m2').textContent='';
a2();a2();r2D()}
function a2(){var e=[];for(var i=0;i<16;i++)if(!b2[i])e.push(i);
if(!e.length)return;b2[e[(Math.random()*e.length)|0]]=Math.random()<.9?2:4}
function r2D(){document.getElementById('s2').textContent=sc2;
var el=document.getElementById('b2');el.innerHTML='';
for(var i=0;i<16;i++){var d=document.createElement('div');d.className='t';
if(b2[i]){d.textContent=b2[i];d.style.background=C2[b2[i]]||'#7b5cff';
if(b2[i]>=1024)d.style.fontSize='14px'}el.appendChild(d)}}
function mv2(dir){if(o2)return;var m=false;var ln=L2[dir];
for(var k=0;k<4;k++){var line=ln[k];var vals=line.map(function(i){return b2[i]});
var tiles=vals.filter(function(v){return v});var out=[];
for(var i=0;i<tiles.length;i++){if(tiles[i]==tiles[i+1]){out.push(tiles[i]*2);
sc2+=tiles[i]*2;i++}else out.push(tiles[i])}
while(out.length<4)out.push(0);
for(var j=0;j<4;j++){if(b2[line[j]]!=out[j])m=true;b2[line[j]]=out[j]}}
if(!m)return;a2();r2D();
if(!wn2&&b2.indexOf(2048)!=-1){wn2=true;document.getElementById('m2').textContent='🎉 2048!'}
var full=true;for(var i=0;i<16;i++)if(!b2[i])full=false;
if(full){var can=false;
for(var r=0;r<4;r++)for(var c=0;c<4;c++){var v=b2[r*4+c];
if(c<3&&v==b2[r*4+c+1])can=true;if(r<3&&v==b2[(r+1)*4+c])can=true}
if(!can){o2=true;document.getElementById('m2').textContent='Конец! Счёт: '+sc2}}}
var t2x=0,t2y=0;
document.getElementById('b2').addEventListener('touchstart',function(e){
var t=e.changedTouches[0];t2x=t.clientX;t2y=t.clientY},{passive:true});
document.getElementById('b2').addEventListener('touchend',function(e){
var t=e.changedTouches[0];var dx=t.clientX-t2x,dy=t.clientY-t2y;
if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;
mv2(Math.abs(dx)>Math.abs(dy)?(dx>0?'r':'l'):(dy>0?'d':'u'))},{passive:true});
var K2={arrowleft:'l',arrowright:'r',arrowup:'u',arrowdown:'d',a:'l',d:'r',w:'u',s:'d'};

/* ПИНГ-ПОНГ */
var pc=document.getElementById('pc'),px2=pc.getContext('2d');
var PW=340,PH=460;pc.width=PW;pc.height=PH;
var p1,p2,bl,ps1,ps2,pRaf,pKeys,pRun,pMsg;
function startPong(){p1=(PW-70)/2;p2=(PW-70)/2;ps1=0;ps2=0;pMsg='';pKeys={};
pRun=true;resetB(Math.random()<.5?1:-1);pUpd();cancelAnimationFrame(pRaf);pLoop()}
function resetB(d){bl={x:PW/2,y:PH/2,r:7,vx:(Math.random()*2-1)*2.6,vy:5*d}}
function pUpd(){document.getElementById('sp').textContent=ps1+':'+ps2}
function pLoop(){if(!pRun){pDraw();return}
if(pKeys.l)p1-=7.5;if(pKeys.r)p1+=7.5;
p1=Math.max(0,Math.min(PW-70,p1));
var tg=bl.x-35;p2+=Math.max(-5.2,Math.min(5.2,tg-p2));
p2=Math.max(0,Math.min(PW-70,p2));
bl.x+=bl.vx;bl.y+=bl.vy;
if(bl.x<bl.r){bl.x=bl.r;bl.vx*=-1}if(bl.x>PW-bl.r){bl.x=PW-bl.r;bl.vx*=-1}
if(bl.vy<0&&bl.y-bl.r<18+12&&bl.y>18&&bl.x>p1&&bl.x<p1+70){
bl.y=30+bl.r;bl.vy=Math.abs(bl.vy)*1.05;bl.vx+=(bl.x-(p1+35))/22}
if(bl.vy>0&&bl.y+bl.r>PH-18-12&&bl.y<PH-18&&bl.x>p2&&bl.x<p2+70){
bl.y=PH-30-bl.r;bl.vy=-Math.abs(bl.vy)*1.05;bl.vx+=(bl.x-(p2+35))/22}
var sp=Math.sqrt(bl.vx*bl.vx+bl.vy*bl.vy),MX=10.5;
if(sp>MX){bl.vx*=MX/sp;bl.vy*=MX/sp}
if(bl.y<-25){ps1++;pUpd();resetB(1)}if(bl.y>PH+25){ps2++;pUpd();resetB(-1)}
if(ps1>=7||ps2>=7){pRun=false;pMsg=ps1>=7?'Вы победили! 🎉':'Победил ИИ 🤖'}
pDraw();if(pRun)pRaf=requestAnimationFrame(pLoop)}
function pDraw(){px2.fillStyle='#0f1729';px2.fillRect(0,0,PW,PH);
px2.setLineDash([6,10]);px2.strokeStyle='rgba(255,255,255,.12)';px2.lineWidth=2;
px2.beginPath();px2.moveTo(0,PH/2);px2.lineTo(PW,PH/2);px2.stroke();px2.setLineDash([]);
px2.fillStyle='rgba(255,255,255,.06)';px2.font='bold 46px sans-serif';px2.textAlign='center';
px2.fillText(ps1,PW/2-45,60);px2.fillText(ps2,PW/2+45,PH-30);
px2.fillStyle='#6ea8ff';px2.fillRect(p1,18,70,12);
px2.fillStyle='#ff8fa8';px2.fillRect(p2,PH-30,70,12);
px2.fillStyle='#7dffc4';px2.shadowColor='#7dffc4';px2.shadowBlur=14;
px2.beginPath();px2.arc(bl.x,bl.y,bl.r,0,Math.PI*2);px2.fill();px2.shadowBlur=0;
if(pMsg){px2.fillStyle='rgba(0,0,0,.8)';px2.fillRect(0,0,PW,PH);
px2.fillStyle='#fff';px2.font='bold 24px sans-serif';
px2.fillText(pMsg,PW/2,PH/2);px2.font='14px sans-serif';px2.fillStyle='#9fb0d4';
px2.fillText('Тап — заново',PW/2,PH/2+32)}}
function pPtr(cx){var r=pc.getBoundingClientRect();
var x=(cx-r.left)*(PW/r.width);p1=Math.max(0,Math.min(PW-70,x-35))}
pc.addEventListener('touchstart',function(e){e.preventDefault();
if(pMsg){startPong();return}pPtr(e.touches[0].clientX)},{passive:false});
pc.addEventListener('touchmove',function(e){e.preventDefault();
pPtr(e.touches[0].clientX)},{passive:false});
pc.addEventListener('mousemove',function(e){pPtr(e.clientX)});

/* КРЕСТИКИ-НОЛИКИ */
var tb,tDone,tLock;
var TW=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function startTTT(){tb=['','','','','','','','',''];tDone=false;tLock=false;
document.getElementById('tm').textContent='';rTTT()}
function rTTT(){var el=document.getElementById('tb');el.innerHTML='';
for(var i=0;i<9;i++){(function(i){var d=document.createElement('div');
d.className='cl'+(tb[i]=='X'?' x':tb[i]=='O'?' o':'');d.textContent=tb[i];
d.onclick=function(){playTTT(i)};el.appendChild(d)})(i)}}
function winTTT(b){for(var i=0;i<8;i++){var w=TW[i];
if(b[w[0]]&&b[w[0]]==b[w[1]]&&b[w[0]]==b[w[2]])return b[w[0]]}
for(var i=0;i<9;i++)if(!b[i])return null;return 'd'}
function mini(b,isMax,d){var w=winTTT(b);
if(w=='O')return 10-d;if(w=='X')return d-10;if(w=='d')return 0;
var best=isMax?-999:999;
for(var i=0;i<9;i++){if(b[i])continue;b[i]=isMax?'O':'X';
var s=mini(b,!isMax,d+1);b[i]='';
best=isMax?Math.max(best,s):Math.min(best,s)}return best}
function bestM(){var best=-999,mv=-1;
for(var i=0;i<9;i++){if(tb[i])continue;tb[i]='O';
var s=mini(tb,false,0);tb[i]='';if(s>best){best=s;mv=i}}return mv}
function playTTT(i){if(tDone||tLock||tb[i])return;tb[i]='X';rTTT();
var w=winTTT(tb);if(w)return finTTT(w);
tLock=true;setTimeout(function(){var m=bestM();if(m>=0)tb[m]='O';rTTT();
tLock=false;var w2=winTTT(tb);if(w2)finTTT(w2)},200)}
function finTTT(w){tDone=true;
if(w=='X')document.getElementById('tm').textContent='🎉 Вы победили!';
else if(w=='O')document.getElementById('tm').textContent='🤖 Победил ИИ';
else document.getElementById('tm').textContent='🤝 Ничья'}

/* МЕМОРИ */
var EMO=['🍎','🍌','🍇','🍒','🍓','🥝','🍑','🍍'];
var mCards,mFirst,mLock,mMoves,mMatched;
function startMem(){var deck=EMO.concat(EMO);
deck.sort(function(){return Math.random()-.5});
mCards=deck.map(function(e){return{e:e,fl:false,dn:false}});
mFirst=null;mLock=false;mMoves=0;mMatched=0;
document.getElementById('sm').textContent=0;
document.getElementById('mm2').textContent='';rMem()}
function rMem(){var el=document.getElementById('mb');el.innerHTML='';
for(var i=0;i<mCards.length;i++){(function(i){var c=mCards[i];
var d=document.createElement('div');
d.className='mc'+(c.dn?' dn':c.fl?' fl':'');
d.textContent=(c.fl||c.dn)?c.e:'';d.onclick=function(){flipMem(i)};
el.appendChild(d)})(i)}}
function flipMem(i){if(mLock)return;var c=mCards[i];if(c.fl||c.dn)return;
c.fl=true;if(mFirst===null){mFirst=i;rMem();return}
mMoves++;document.getElementById('sm').textContent=mMoves;rMem();
if(mCards[mFirst].e==c.e){mCards[mFirst].dn=true;c.dn=true;
mCards[mFirst].fl=false;c.fl=false;mFirst=null;mMatched++;rMem();
if(mMatched==8)document.getElementById('mm2').textContent='🎉 Все пары! Ходов: '+mMoves}
else{mLock=true;var f=mFirst;mFirst=null;
setTimeout(function(){mCards[f].fl=false;c.fl=false;mLock=false;rMem()},700)}}

/* КЛАВИАТУРА */
document.addEventListener('keydown',function(e){var k=e.key.toLowerCase();
if(cur=='snake'&&SK[k]){e.preventDefault();sd(SK[k][0],SK[k][1])}
if(cur=='g2048'&&K2[k]){e.preventDefault();mv2(K2[k])}
if(cur=='pong'){if(k=='arrowleft'||k=='a'){e.preventDefault();pKeys.l=true}
if(k=='arrowright'||k=='d'){e.preventDefault();pKeys.r=true}
if(e.key=='Enter'&&pMsg)startPong()}});
document.addEventListener('keyup',function(e){var k=e.key.toLowerCase();
if(cur=='pong'){if(k=='arrowleft'||k=='a')pKeys.l=false;
if(k=='arrowright'||k=='d')pKeys.r=false}});
</script></body></html>
