<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0e17">
<title>Стрелялки — Сайт lolkek</title>
<link rel="stylesheet" href="notes.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,system-ui,'Segoe UI',Roboto,sans-serif;background:radial-gradient(circle at 20% 10%,#2a1b1b,#0a0e17 70%);background-attachment:fixed;color:#e8eefc;padding:14px 12px 40px;min-height:100vh;font-size:14px;overflow-x:hidden}
#a{max-width:520px;margin:0 auto}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}
.topbar h1{font-size:18px;font-weight:800;color:#ff8fa8}
.btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.13);color:#e8eefc;padding:9px 14px;border-radius:9px;font-family:inherit;font-size:13px;font-weight:600;min-height:38px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;transition:.15s}
.btn:hover{background:rgba(255,255,255,.16)}
.menu{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:20px}
.card{display:flex;align-items:center;gap:14px;padding:18px 16px;border:1px solid rgba(255,143,168,.25);border-radius:16px;background:linear-gradient(160deg,rgba(255,80,80,.08),rgba(255,255,255,.02));color:#e8eefc;font-family:inherit;text-decoration:none;cursor:pointer;transition:.15s}
.card:hover{transform:translateY(-2px);border-color:#ff8fa8;box-shadow:0 10px 24px rgba(255,80,80,.2)}
.card:active{transform:scale(.97)}
.card .ico{font-size:38px;flex-shrink:0}
.card .txt{flex:1;text-align:left}
.card .name{font-size:16px;font-weight:800;display:block;color:#ff8fa8}
.card .desc{font-size:12px;color:#8b9ac0;display:block;margin-top:3px}
.card .arrow{color:#6ea8ff;font-size:20px;flex-shrink:0}
.card.soon{opacity:.6;cursor:default}
.card.soon:hover{transform:none;border-color:rgba(255,143,168,.25);box-shadow:none}
.badge{background:#f9a825;color:#000;font-size:10px;font-weight:900;padding:4px 10px;border-radius:9px;letter-spacing:.5px}
</style>
</head>
<body>
<div id="a">

<div class="topbar">
  <a class="btn" href="index.html">← Главная</a>
  <h1>🔫 Стрелялки</h1>
  <span style="width:60px"></span>
</div>

<div class="menu">
  <a class="card" href="cs2d.html">
    <span class="ico">💣</span>
    <span class="txt">
      <span class="name">Strike 2D (CS)</span>
      <span class="desc">Стрелялка вид сверху • 3 оружия • рейтинг</span>
    </span>
    <span class="arrow">▶</span>
  </a>
  <div class="card soon">
    <span class="ico">🔫</span>
    <span class="txt">
      <span class="name">Standoff 2D</span>
      <span class="desc">Командный бой 5v5</span>
    </span>
    <span class="badge">СКОРО</span>
  </div>
</div>

<div class="notes-section">
  <div class="notes-header">
    <h2>📌 Заметки от админа</h2>
    <button class="notes-lock" id="notesLock">🔒</button>
  </div>
  <div id="notesList"></div>
</div>

</div>

<div class="notes-modal" id="notesModal">
  <div class="notes-modal-box">
    <h3>🔐 Заметки админа</h3>
    <div id="notesPwdArea">
      <input type="password" id="notesPwd" placeholder="Пароль" autocomplete="off">
      <button class="notes-btn" id="notesLoginBtn" style="width:100%">Войти</button>
    </div>
    <div id="notesAdminArea" style="display:none">
      <label class="notes-label">Заголовок</label>
      <input type="text" id="noteTitleInput" placeholder="Например: Новость">
      <label class="notes-label">Текст заметки</label>
      <textarea id="noteTextInput" placeholder="Текст..."></textarea>
      <div class="notes-modal-btns"><button class="notes-btn" id="notesAddBtn" style="width:100%">➕ Добавить</button></div>
    </div>
    <div class="notes-msg" id="notesMsg"></div>
    <div class="notes-modal-btns"><button class="notes-btn" id="notesCloseBtn" style="width:100%">Закрыть</button></div>
  </div>
</div>

<script src="notes.js"></script>
</body>
</html>
