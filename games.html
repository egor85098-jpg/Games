<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0e17">
<title>Мини-игры — Сайт lolkek</title>
<link rel="stylesheet" href="notes.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,Helvetica,Arial,sans-serif;background:radial-gradient(circle at 20% 10%,#1b2a4a,#0a0e17 70%);background-attachment:fixed;color:#e8eefc;padding:12px 10px 30px;min-height:100vh;-webkit-user-select:none;user-select:none;overflow-x:hidden;font-size:14px}
#a{max-width:520px;margin:0 auto}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.topbar h1{font-size:18px;font-weight:800;color:#7dffc4}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{display:flex;flex-direction:column;align-items:center;padding:16px 8px;border:1px solid rgba(255,255,255,.1);border-radius:14px;background:rgba(255,255,255,.05);color:#e8eefc;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;-webkit-appearance:none;appearance:none}
.card:active{transform:scale(.96);background:rgba(255,255,255,.12)}
.card .ico{font-size:30px;margin-bottom:6px}
.card .desc{font-size:10px;color:#8b9ac0;margin-top:3px}
.game{display:none;flex-direction:column;align-items:center;gap:10px}
.game.on{display:flex}
.bar{width:100%;display:flex;justify-content:space-between;align-items:center;gap:6px}
.bar h2{font-size:14px}
.hud{font-size:12px;color:#9fb0d4}.hud b{color:#7dffc4}
.btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.13);color:#e8eefc;padding:8px 12px;border-radius:9px;font-family:inherit;font-size:12px;font-weight:600;min-height:34px;cursor:pointer;-webkit-appearance:none;appearance:none;text-decoration:none;display:inline-flex;align-items:center}
.btn:active{background:rgba(255,255,255,.22)}
canvas{border-radius:10px;touch-action:none;max-width:100%;display:block}
.dp{display:grid;grid-template-columns:repeat(3,54px);gap:6px}
.dp button{width:54px;height:54px;border-radius:12px;font-size:20px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.13);color:#e8eefc;-webkit-appearance:none;appearance:none}
.dp button:active{background:rgba(255,255,255,.24)}
.sp{visibility:hidden}
.b2{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:5px;background:#161f36;border-radius:12px;width:min(300px,86vw);touch-action:none}
.t{display:flex;align-items:center;justify-content:center;border-radius:7px;font-weight:800;color:#fff;background:rgba(255,255,255,.045);font-size:15px;height:60px}
.ms{min-height:16px;font-size:12px;color:#ffd479;font-weight:600;text-align:center}
.tt{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;width:min(260px,82vw)}
.cl{height:75px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:10px;font-size:38px;font-weight:800;cursor:pointer}
.cl:active{background:rgba(255,255,255,.14)}
.cl.x{color:#6ea8ff}.cl.o{color:#ff8fa8}
.mm{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;width:min(300px,86vw)}
.mc{height:65px;display:flex;align-items:center;justify-content:center;font-size:26px;border-radius:9px;background:#2a3a63;border:1px solid rgba(255,255,255,.1);cursor:pointer}
.mc.fl,.mc.dn{background:#3d5a8f;border-color:#6ea8ff}
.mc.dn{opacity:.5}
#paintCanvas{background:#fff;border-radius:12px;touch-action:none;width:min(300px,86vw);height:min(340px,50vh);cursor:crosshair}
.palette{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;width:min(300px,86vw)}
.swatch{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.15);cursor:pointer;padding:0;-webkit-appearance:none;appearance:none}
.swatch.active{border-color:#fff;box-shadow:0 0 10px currentColor}
.sizes{display:flex;gap:6px;justify-content:center;align-items:center}
.size-btn{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.15);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;-webkit-appearance:none;appearance:none}
.size-btn.active{border-color:#6ea8ff;background:rgba(110,168,255,.2)}
.size-dot{background:#e8eefc;border-radius:50%}
</style>
</head>
<body>
<div id="a">

<div class="topbar">
  <a class="btn" href="index.html">← Главная</a>
  <h1>🎮 Мини-игры</h1>
</div>

<div id="menu" class="menu">
  <button class="card" onclick="openGame('snake')"><span class="ico">🐍</span>Змейка<span class="desc">Собирай яблоки</span></button>
  <button class="card" onclick="openGame('g2048')"><span class="ico">🔢</span>2048<span class="desc">Сложи плитки</span></button>
  <button class="card" onclick="openGame('pong')"><span class="ico">🏓</span>Пинг-понг<span class="desc">До 7 очков</span></button>
  <button class="card" onclick="openGame('ttt')"><span class="ico">❌</span>Крестики-нолики<span class="desc">Против ИИ</span></button>
  <button class="card" onclick="openGame('memory')"><span class="ico">🧠</span>Мемори<span class="desc">Найди пары</span></button>
  <button class="card" onclick="openGame('paint')"><span class="ico">🎨</span>Paint<span class="desc">Рисуй пальцем</span></button>
</div>

<div id="snake" class="game">
  <div class="bar"><button class="btn" onclick="back()">← Меню</button><h2>🐍 Змейка</h2><div class="hud">Счёт: <b id="ss">0</b></div></div>
  <canvas id="sc"></canvas>
  <div class="dp"><span class="sp"></span><button onclick="sd(0,-1)">▲</button><span class="sp"></span><button onclick="sd(-1,0)">◀</button><button onclick="sd(0,1)">▼</button><button onclick="sd(1,0)">▶</button></div>
</div>

<div id="g2048" class="game">
  <div class="bar"><button class="btn" onclick="back()">← Меню</button><h2>🔢 2048</h2><div class="hud">Счёт: <b id="s2">0</b></div></div>
  <div id="b2" class="b2"></div>
  <div id="m2" class="ms"></div>
  <button class="btn" onclick="start2048()">🔄 Новая</button>
</div>

<div id="pong" class="game">
  <div class="bar"><button class="btn" onclick="back()">← Меню</button><h2>🏓 Пинг-понг</h2><div class="hud">Вы <b id="sp">0:0</b> ИИ</div></div>
  <canvas id="pc"></canvas>
</div>

<div id="ttt" class="game">
  <div class="bar"><button class="btn" onclick="back()">← Меню</button><h2>❌ Нолики</h2><div class="hud">Вы — X</div></div>
  <div id="tb" class="tt"></div>
  <div id="tm" class="ms"></div>
  <button class="btn" onclick="startTTT()">🔄 Заново</button>
</div>

<div id="memory" class="game">
  <div class="bar"><button class="btn" onclick="back()">← Меню</button><h2>🧠 Мемори</h2><div class="hud">Ходы: <b id="sm">0</b></div></div>
  <div id="mb" class="mm"></div>
  <div id="mm2" class="ms"></div>
  <button class="btn" onclick="startMem()">🔄 Заново</button>
</div>

<div id="paint" class="game">
  <div class="bar"><button class="btn" onclick="back()">← Меню</button><h2>🎨 Paint</h2><div class="hud">Рисуй!</div></div>
  <canvas id="paintCanvas"></canvas>
  <div class="palette" id="palette"></div>
  <div class="sizes" id="sizes"></div>
  <div style="display:flex;gap:6px">
    <button class="btn" onclick="clearPaint()">🧹 Очистить</button>
    <button class="btn" onclick="savePaint()">💾 Сохранить</button>
  </div>
</div>

<!-- ЗАМЕТКИ -->
<div class="notes-section" style="margin-top:24px">
  <div class="notes-header">
    <h2>📌 Заметки от админа</h2>
    <button class="notes-lock" id="notesLock">🔒</button>
  </div>
  <div id="notesList"></div>
</div>

</div>

<div class="notes-modal" id="notesModal">
  <div class="notes-modal-box">
    <h3>🔐 Заметки админа</h3>
    <div id="notesPwdArea">
      <input type="password" id="notesPwd" placeholder="Пароль" autocomplete="off">
      <button class="notes-btn" id="notesLoginBtn" style="width:100%">Войти</button>
    </div>
    <div id="notesAdminArea" style="display:none">
      <label class="notes-label">Заголовок</label>
      <input type="text" id="noteTitleInput" placeholder="Например: Новость">
      <label class="notes-label">Текст заметки</label>
      <textarea id="noteTextInput" placeholder="Текст..."></textarea>
      <div class="notes-modal-btns"><button class="notes-btn" id="notesAddBtn" style="width:100%">➕ Добавить</button></div>
    </div>
    <div class="notes-msg" id="notesMsg"></div>
    <div class="notes-modal-btns"><button class="notes-btn" id="notesCloseBtn" style="width:100%">Закрыть</button></div>
  </div>
</div>

<script src="notes.js"></script>
<script>
var cur=null;
function openGame(id){document.getElementById('menu').style.display='none';document.getElementById(id).classList.add('on');cur=id;if(id==='snake')resetSnake();if(id==='g2048')start2048();if(id==='pong')startPong();if(id==='ttt')startTTT();if(id==='memory')startMem();if(id==='paint')initPaint();}
function back(){if(cur==='snake'&&sTimer)clearInterval(sTimer);if(cur==='pong'&&pRun)pRun=false;document.getElementById(cur).classList.remove('on');document.getElementById('menu').style.display='grid';cur=null;}

/* ЗМЕЙКА */
var sc=document.getElementById('sc'),sx2=sc.getContext('2d');
var SN=13,SS=Math.min(window.innerWidth*.86,280),SC=Math.floor(SS/SN);
sc.width=SC*SN;sc.height=SC*SN;
var snk,sdir,sq,sfood,sscore,sTimer,sspeed,sover;
function rndF(){var p;do{p={x:(Math.random()*SN)|0,y:(Math.random()*SN)|0}}while(snk.some(function(s){return s.x==p.x&&s.y==p.y}));return p;}
function resetSnake(){snk=[{x:6,y:6},{x:5,y:6},{x:4,y:6}];sdir={x:1,y:0};sq=[];sscore=0;sspeed=200;sover=false;sfood=rndF();document.getElementById('ss').textContent=0;clearInterval(sTimer);sTimer=setInterval(sTick,sspeed);sDraw();}
function sTick(){if(sover)return;if(sq.length){var nd=sq.shift();if(nd.x!=-sdir.x||nd.y!=-sdir.y)sdir=nd;}var h={x:snk[0].x+sdir.x,y:snk[0].y+sdir.y};if(h.x<0||h.y<0||h.x>=SN||h.y>=SN||snk.some(function(s){return s.x==h.x&&s.y==h.y})){sover=true;clearInterval(sTimer);sDraw();return;}snk.unshift(h);if(h.x==sfood.x&&h.y==sfood.y){sscore+=10;document.getElementById('ss').textContent=sscore;sfood=rndF();if(sspeed>90){sspeed-=8;clearInterval(sTimer);sTimer=setInterval(sTick,sspeed);}}else snk.pop();sDraw();}
function sR(x,y,w,h,r){sx2.beginPath();sx2.moveTo(x+r,y);sx2.arcTo(x+w,y,x+w,y+h,r);sx2.arcTo(x+w,y+h,x,y+h,r);sx2.arcTo(x,y+h,x,y,r);sx2.arcTo(x,y,x+w,y,r);sx2.closePath();}
function sDraw(){sx2.fillStyle='#0f1729';sx2.fillRect(0,0,sc.width,sc.height);sx2.fillStyle='#ff5a7a';sR(sfood.x*SC+2,sfood.y*SC+2,SC-4,SC-4,4);sx2.fill();for(var i=0;i<snk.length;i++){var s=snk[i];sx2.fillStyle=i===0?'#7dffc4':'hsl(160,60%,'+Math.max(30,52-i*1.5)+'%)';sR(s.x*SC+1,s.y*SC+1,SC-2,SC-2,i===0?4:3);sx2.fill();}if(sover){sx2.fillStyle='rgba(0,0,0,.8)';sx2.fillRect(0,0,sc.width,sc.height);sx2.fillStyle='#fff';sx2.textAlign='center';sx2.font='bold '+(SC*1.1)+'px sans-serif';sx2.fillText('Конец',sc.width/2,sc.height/2);sx2.font=(SC*.55)+'px sans-serif';sx2.fillStyle='#9fb0d4';sx2.fillText('Счёт: '+sscore+' • тап',sc.width/2,sc.height/2+SC);}}
function sd(x,y){var l=sq.length?sq[sq.length-1]:sdir;if(x==-l.x&&y==-l.y)return;if(x==l.x&&y==l.y)return;if(sq.length<2)sq.push({x:x,y:y});}
var stx=0,sty=0;
sc.addEventListener('touchstart',function(e){var t=e.changedTouches[0];stx=t.clientX;sty=t.clientY;if(sover)resetSnake();},{passive:true});
sc.addEventListener('touchend',function(e){var t=e.changedTouches[0];var dx=t.clientX-stx,dy=t.clientY-sty;if(Math.max(Math.abs(dx),Math.abs(dy))<18)return;if(Math.abs(dx)>Math.abs(dy))sd(dx>0?1:-1,0);else sd(0,dy>0?1:-1);},{passive:true});
var SK={arrowup:[0,-1],arrowdown:[0,1],arrowleft:[-1,0],arrowright:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]};

/* 2048 */
var b2,sc2,o2,wn2;
var C2={2:'#3b4a6b',4:'#41577f',8:'#e8a33d',16:'#e88b2f',32:'#e56a3c',64:'#e04b4b',128:'#4fbf7a',256:'#3fae6b',512:'#37a05f',1024:'#3b7ddd',2048:'#7b5cff'};
var L2={l:[],r:[],u:[],d:[]};
for(var r2=0;r2<4;r2++){L2.l.push([0,1,2,3].map(function(c){return r2*4+c}));L2.r.push([3,2,1,0].map(function(c){return r2*4+c}))}
for(var c2=0;c2<4;c2++){L2.u.push([0,1,2,3].map(function(r){return r*4+c2}));L2.d.push([3,2,1,0].map(function(r){return r*4+c2}))}
function start2048(){b2=[];for(var i=0;i<16;i++)b2.push(0);sc2=0;o2=false;wn2=false;document.getElementById('m2').textContent='';a2();a2();r2D();}
function a2(){var e=[];for(var i=0;i<16;i++)if(!b2[i])e.push(i);if(!e.length)return;b2[e[(Math.random()*e.length)|0]]=Math.random()<.9?2:4;}
function r2D(){document.getElementById('s2').textContent=sc2;var el=document.getElementById('b2');el.innerHTML='';for(var i=0;i<16;i++){var d=document.createElement('div');d.className='t';if(b2[i]){d.textContent=b2[i];d.style.background=C2[b2[i]]||'#7b5cff';}el.appendChild(d);}}
function mv2(dir){if(o2)return;var m=false;var ln=L2[dir];for(var k=0;k<4;k++){var line=ln[k];var vals=line.map(function(i){return b2[i]});var tiles=vals.filter(function(v){return v});var out=[];for(var i=0;i<tiles.length;i++){if(tiles[i]==tiles[i+1]){out.push(tiles[i]*2);sc2+=tiles[i]*2;i++;}else out.push(tiles[i]);}while(out.length<4)out.push(0);for(var j=0;j<4;j++){if(b2[line[j]]!=out[j])m=true;b2[line[j]]=out[j];}}if(!m)return;a2();r2D();if(!wn2&&b2.indexOf(2048)!=-1){wn2=true;document.getElementById('m2').textContent='🎉 2048!';}var full=true;for(var i=0;i<16;i++)if(!b2[i])full=false;if(full){var can=false;for(var r=0;r<4;r++)for(var c=0;c<4;c++){var v=b2[r*4+c];if(c<3&&v==b2[r*4+c+1])can=true;if(r<3&&v==b2[(r+1)*4+c])can=true;}if(!can){o2=true;document.getElementById('m2').textContent='Конец! Счёт: '+sc2;}}}
var t2x=0,t2y=0;
document.getElementById('b2').addEventListener('touchstart',function(e){var t=e.changedTouches[0];t2x=t.clientX;t2y=t.clientY;},{passive:true});
document.getElementById('b2').addEventListener('touchend',function(e){var t=e.changedTouches[0];var dx=t.clientX-t2x,dy=t.clientY-t2y;if(Math.max(Math.abs(dx),Math.abs(dy))<22)return;mv2(Math.abs(dx)>Math.abs(dy)?(dx>0?'r':'l'):(dy>0?'d':'u'));},{passive:true});
var K2={arrowleft:'l',arrowright:'r',arrowup:'u',arrowdown:'d',a:'l',d:'r',w:'u',s:'d'};

/* ПИНГ-ПОНГ */
var pc=document.getElementById('pc'),px2=pc.getContext('2d');
var PW=300,PH=380;pc.width=PW;pc.height=PH;
var p1,p2,bl,ps1,ps2,pRaf,pKeys,pRun,pMsg;
function startPong(){p1=(PW-70)/2;p2=(PW-70)/2;ps1=0;ps2=0;pMsg='';pKeys={};pRun=true;resetB(Math.random()<.5?1:-1);pUpd();cancelAnimationFrame(pRaf);pLoop();}
function resetB(d){bl={x:PW/2,y:PH/2,r:6,vx:(Math.random()*2-1)*2.4,vy:4.5*d};}
function pUpd(){document.getElementById('sp').textContent=ps1+':'+ps2;}
function pLoop(){if(!pRun){pDraw();return;}if(pKeys.l)p1-=7;if(pKeys.r)p1+=7;p1=Math.max(0,Math.min(PW-70,p1));var tg=bl.x-35;p2+=Math.max(-5,Math.min(5,tg-p2));p2=Math.max(0,Math.min(PW-70,p2));bl.x+=bl.vx;bl.y+=bl.vy;if(bl.x<bl.r){bl.x=bl.r;bl.vx*=-1}if(bl.x>PW-bl.r){bl.x=PW-bl.r;bl.vx*=-1}if(bl.vy<0&&bl.y-bl.r<28&&bl.y>16&&bl.x>p1&&bl.x<p1+70){bl.y=28+bl.r;bl.vy=Math.abs(bl.vy)*1.05;bl.vx+=(bl.x-(p1+35))/20;}if(bl.vy>0&&bl.y+bl.r>PH-28&&bl.y<PH-16&&bl.x>p2&&bl.x<p2+70){bl.y=PH-28-bl.r;bl.vy=-Math.abs(bl.vy)*1.05;bl.vx+=(bl.x-(p2+35))/20;}var sp=Math.sqrt(bl.vx*bl.vx+bl.vy*bl.vy),MX=9;if(sp>MX){bl.vx*=MX/sp;bl.vy*=MX/sp;}if(bl.y<-25){ps1++;pUpd();resetB(1);}if(bl.y>PH+25){ps2++;pUpd();resetB(-1);}if(ps1>=7||ps2>=7){pRun=false;pMsg=ps1>=7?'Победа! 🎉':'ИИ победил 🤖';}pDraw();if(pRun)pRaf=requestAnimationFrame(pLoop);}
function pDraw(){px2.fillStyle='#0f1729';px2.fillRect(0,0,PW,PH);px2.setLineDash([5,8]);px2.strokeStyle='rgba(255,255,255,.12)';px2.lineWidth=2;px2.beginPath();px2.moveTo(0,PH/2);px2.lineTo(PW,PH/2);px2.stroke();px2.setLineDash([]);px2.fillStyle='rgba(255,255,255,.08)';px2.font='bold 38px sans-serif';px2.textAlign='center';px2.fillText(ps1,PW/2-40,50);px2.fillText(ps2,PW/2+40,PH-25);px2.fillStyle='#6ea8ff';px2.fillRect(p1,16,70,10);px2.fillStyle='#ff8fa8';px2.fillRect(p2,PH-26,70,10);px2.fillStyle='#7dffc4';px2.beginPath();px2.arc(bl.x,bl.y,bl.r,0,Math.PI*2);px2.fill();if(pMsg){px2.fillStyle='rgba(0,0,0,.8)';px2.fillRect(0,0,PW,PH);px2.fillStyle='#fff';px2.font='bold 20px sans-serif';px2.fillText(pMsg,PW/2,PH/2);px2.font='13px sans-serif';px2.fillStyle='#9fb0d4';px2.fillText('Тап — заново',PW/2,PH/2+26);}}
function pPtr(cx){var r=pc.getBoundingClientRect();var x=(cx-r.left)*(PW/r.width);p1=Math.max(0,Math.min(PW-70,x-35));}
pc.addEventListener('touchstart',function(e){e.preventDefault();if(pMsg){startPong();return;}pPtr(e.touches[0].clientX);},{passive:false});
pc.addEventListener('touchmove',function(e){e.preventDefault();pPtr(e.touches[0].clientX);},{passive:false});
pc.addEventListener('mousemove',function(e){pPtr(e.clientX);});

/* КРЕСТИКИ-НОЛИКИ */
var tb,tDone,tLock;
var TW=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function startTTT(){tb=['','','','','','','','',''];tDone=false;tLock=false;document.getElementById('tm').textContent='';rTTT();}
function rTTT(){var el=document.getElementById('tb');el.innerHTML='';for(var i=0;i<9;i++){(function(i){var d=document.createElement('div');d.className='cl'+(tb[i]=='X'?' x':tb[i]=='O'?' o':'');d.textContent=tb[i];d.onclick=function(){playTTT(i)};el.appendChild(d);})(i);}}
function winTTT(b){for(var i=0;i<8;i++){var w=TW[i];if(b[w[0]]&&b[w[0]]==b[w[1]]&&b[w[0]]==b[w[2]])return b[w[0]];}for(var i=0;i<9;i++)if(!b[i])return null;return 'd';}
function mini(b,isMax,d){var w=winTTT(b);if(w=='O')return 10-d;if(w=='X')return d-10;if(w=='d')return 0;var best=isMax?-999:999;for(var i=0;i<9;i++){if(b[i])continue;b[i]=isMax?'O':'X';var s=mini(b,!isMax,d+1);b[i]='';best=isMax?Math.max(best,s):Math.min(best,s);}return best;}
function bestM(){var best=-999,mv=-1;for(var i=0;i<9;i++){if(tb[i])continue;tb[i]='O';var s=mini(tb,false,0);tb[i]='';if(s>best){best=s;mv=i;}}return mv;}
function playTTT(i){if(tDone||tLock||tb[i])return;tb[i]='X';rTTT();var w=winTTT(tb);if(w)return finTTT(w);tLock=true;setTimeout(function(){var m=bestM();if(m>=0)tb[m]='O';rTTT();tLock=false;var w2=winTTT(tb);if(w2)finTTT(w2);},180);}
function finTTT(w){tDone=true;var el=document.getElementById('tm');if(w=='X')el.textContent='🎉 Победа!';else if(w=='O')el.textContent='🤖 ИИ победил';else el.textContent='🤝 Ничья';}

/* МЕМОРИ */
var EMO=['🍎','🍌','🍇','🍒','🍓','🥝','🍑','🍍'];
var mCards,mFirst,mLock,mMoves,mMatched;
function startMem(){var deck=EMO.concat(EMO);deck.sort(function(){return Math.random()-.5});mCards=deck.map(function(e){return{e:e,fl:false,dn:false}});mFirst=null;mLock=false;mMoves=0;mMatched=0;document.getElementById('sm').textContent=0;document.getElementById('mm2').textContent='';rMem();}
function rMem(){var el=document.getElementById('mb');el.innerHTML='';for(var i=0;i<mCards.length;i++){(function(i){var c=mCards[i];var d=document.createElement('div');d.className='mc'+(c.dn?' dn':c.fl?' fl':'');d.textContent=(c.fl||c.dn)?c.e:'';d.onclick=function(){flipMem(i)};el.appendChild(d);})(i);}}
function flipMem(i){if(mLock)return;var c=mCards[i];if(c.fl||c.dn)return;c.fl=true;if(mFirst===null){mFirst=i;rMem();return;}mMoves++;document.getElementById('sm').textContent=mMoves;rMem();if(mCards[mFirst].e==c.e){mCards[mFirst].dn=true;c.dn=true;mCards[mFirst].fl=false;c.fl=false;mFirst=null;mMatched++;rMem();if(mMatched==8)document.getElementById('mm2').textContent='🎉 Все пары! Ходов: '+mMoves;}else{mLock=true;var f=mFirst;mFirst=null;setTimeout(function(){mCards[f].fl=false;c.fl=false;mLock=false;rMem();},650);}}

/* PAINT */
var paintCanvas,paintCtx,paintColor='#000000',paintSize=4,painting=false,lastX=0,lastY=0,paintInit=false;
function initPaint(){paintCanvas=document.getElementById('paintCanvas');paintCtx=paintCanvas.getContext('2d');if(!paintInit){var rect=paintCanvas.getBoundingClientRect();paintCanvas.width=rect.width;paintCanvas.height=rect.height;paintCtx.fillStyle='#fff';paintCtx.fillRect(0,0,paintCanvas.width,paintCanvas.height);paintCtx.lineCap='round';paintCtx.lineJoin='round';buildPalette();buildSizes();bindPaintEvents();paintInit=true;}}
function buildPalette(){var colors=['#000000','#ffffff','#ff3b30','#ff9500','#ffcc00','#34c759','#00c7be','#007aff','#5856d6','#af52de','#ff2d55','#8b5a2b'];var el=document.getElementById('palette');el.innerHTML='';colors.forEach(function(c,i){var b=document.createElement('button');b.className='swatch'+(i===0?' active':'');b.style.background=c;b.style.color=c;b.onclick=function(){paintColor=c;var all=document.querySelectorAll('.swatch');for(var k=0;k<all.length;k++)all[k].classList.remove('active');b.classList.add('active');};el.appendChild(b);});}
function buildSizes(){var sizes=[2,4,8,16,24];var el=document.getElementById('sizes');el.innerHTML='';sizes.forEach(function(s,i){var b=document.createElement('button');b.className='size-btn'+(i===1?' active':'');var dot=document.createElement('div');dot.className='size-dot';var ds=Math.min(s,18);dot.style.width=ds+'px';dot.style.height=ds+'px';b.appendChild(dot);b.onclick=function(){paintSize=s;var all=document.querySelectorAll('.size-btn');for(var k=0;k<all.length;k++)all[k].classList.remove('active');b.classList.add('active');};el.appendChild(b);});}
function getPos(e,canvas){var r=canvas.getBoundingClientRect();var t=e.touches?e.touches[0]:e;return{x:(t.clientX-r.left)*(canvas.width/r.width),y:(t.clientY-r.top)*(canvas.height/r.height)};}
function bindPaintEvents(){
  paintCanvas.addEventListener('mousedown',function(e){painting=true;var p=getPos(e,paintCanvas);lastX=p.x;lastY=p.y;paintCtx.fillStyle=paintColor;paintCtx.beginPath();paintCtx.arc(p.x,p.y,paintSize/2,0,Math.PI*2);paintCtx.fill();});
  paintCanvas.addEventListener('mousemove',function(e){if(!painting)return;var p=getPos(e,paintCanvas);paintCtx.strokeStyle=paintColor;paintCtx.lineWidth=paintSize;paintCtx.beginPath();paintCtx.moveTo(lastX,lastY);paintCtx.lineTo(p.x,p.y);paintCtx.stroke();lastX=p.x;lastY=p.y;});
  document.addEventListener('mouseup',function(){painting=false;});
  paintCanvas.addEventListener('touchstart',function(e){e.preventDefault();painting=true;var p=getPos(e,paintCanvas);lastX=p.x;lastY=p.y;paintCtx.fillStyle=paintColor;paintCtx.beginPath();paintCtx.arc(p.x,p.y,paintSize/2,0,Math.PI*2);paintCtx.fill();},{passive:false});
  paintCanvas.addEventListener('touchmove',function(e){e.preventDefault();if(!painting)return;var p=getPos(e,paintCanvas);paintCtx.strokeStyle=paintColor;paintCtx.lineWidth=paintSize;paintCtx.beginPath();paintCtx.moveTo(lastX,lastY);paintCtx.lineTo(p.x,p.y);paintCtx.stroke();lastX=p.x;lastY=p.y;},{passive:false});
  paintCanvas.addEventListener('touchend',function(e){e.preventDefault();painting=false;},{passive:false});
}
function clearPaint(){if(!paintCtx)return;paintCtx.fillStyle='#fff';paintCtx.fillRect(0,0,paintCanvas.width,paintCanvas.height);}
function savePaint(){if(!paintCanvas)return;try{var link=document.createElement('a');link.download='paint-'+Date.now()+'.png';link.href=paintCanvas.toDataURL('image/png');link.click();}catch(e){alert('Не поддерживается');}}

/* КЛАВИАТУРА */
document.addEventListener('keydown',function(e){
  var k=e.key.toLowerCase();
  if(cur==='snake'&&SK[k]){e.preventDefault();sd(SK[k][0],SK[k][1]);}
  if(cur==='g2048'&&K2[k]){e.preventDefault();mv2(K2[k]);}
  if(cur==='pong'){if(k==='arrowleft'||k==='a'){e.preventDefault();pKeys.l=true;}if(k==='arrowright'||k==='d'){e.preventDefault();pKeys.r=true;}if(e.key==='Enter'&&pMsg)startPong();}
});
document.addEventListener('keyup',function(e){var k=e.key.toLowerCase();if(cur==='pong'){if(k==='arrowleft'||k==='a')pKeys.l=false;if(k==='arrowright'||k==='d')pKeys.r=false;}});
</script>
